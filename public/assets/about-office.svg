<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2535"/>
      <stop offset="1" stop-color="#0a121f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2140"/>
      <stop offset="1" stop-color="#050d1b"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5a49"/>
      <stop offset="1" stop-color="#3a2f26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#d4a84a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d4a84a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="900" fill="url(#bg)"/>
  <rect width="900" height="900" fill="url(#glow)"/>
  <!-- window light bars -->
  <g opacity="0.12" fill="#ffffff">
    <rect x="80" y="60" width="60" height="420"/>
    <rect x="170" y="60" width="60" height="420"/>
    <rect x="260" y="60" width="60" height="420"/>
  </g>
  <!-- plant -->
  <g transform="translate(700 380)">
    <path d="M60 300 C20 220 10 140 50 40 C70 130 75 220 60 300Z" fill="#35523a"/>
    <path d="M60 300 C100 220 140 160 120 70 C80 140 60 220 60 300Z" fill="#46684a"/>
    <rect x="30" y="300" width="70" height="60" fill="#d8d4cb"/>
  </g>
  <!-- table -->
  <rect y="600" width="900" height="300" fill="url(#table)"/>
  <rect y="600" width="900" height="6" fill="#8a7560" opacity="0.6"/>
  <!-- laptop -->
  <path d="M230 270 L690 270 L710 580 L210 580 Z" fill="#12171f"/>
  <path d="M244 284 L676 284 L694 566 L226 566 Z" fill="url(#screen)"/>
  <text x="460" y="440" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="54" fill="#ffffff">fudigita</text>
  <text x="460" y="472" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="500" font-size="13" letter-spacing="6" fill="#d4a84a">DIGITAL AGENCY</text>
  <path d="M160 580 L760 580 L820 640 L100 640 Z" fill="#b8c0cc"/>
  <path d="M100 640 L820 640 L818 654 L102 654 Z" fill="#7e8795"/>
  <!-- bowl + notebook -->
  <ellipse cx="170" cy="700" rx="90" ry="20" fill="#e9e6df"/>
  <rect x="640" y="690" width="170" height="14" fill="#2b3647"/>
</svg>
